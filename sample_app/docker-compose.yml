version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: colab_demo_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
